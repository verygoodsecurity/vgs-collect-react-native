---
name: Sync VGS Collect React Native skill to private catalog

'on':
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: sync-vgs-collect-react-native-guide-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Create private catalog skill sync pull request
    runs-on: ubuntu-24.04

    steps:
      - name: Create token for the private skills catalog
        id: catalog-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2
        with:
          app-id: ${{ secrets.VGS_GITHUB_CI_BOT_APP_ID }}
          private-key: ${{ secrets.VGS_GITHUB_CI_BOT_APP_PEM_FILE }}
          owner: verygoodsecurity
          repositories: skills-private
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout the released VGS Collect React Native source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ github.ref }}
          path: vgs-collect-react-native
          persist-credentials: false

      - name: Checkout the private skills catalog
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          repository: verygoodsecurity/skills-private
          ref: main
          path: private-skills
          persist-credentials: false
          token: ${{ steps.catalog-token.outputs.token }}

      - name: Replace the private skill with the released source bundle
        shell: bash
        run: |
          set -euo pipefail
          git -C private-skills rm -r --ignore-unmatch \
            skills/vgs-collect-react-native-guide
          while IFS= read -r -d '' source_path; do
            target_path="private-skills/${source_path}"
            mkdir -p "$(dirname "$target_path")"
            cp -- "vgs-collect-react-native/${source_path}" "$target_path"
          done < <(git -C vgs-collect-react-native ls-files -z -- \
            skills/vgs-collect-react-native-guide)
          git -C private-skills add --all \
            skills/vgs-collect-react-native-guide

      - name: Validate the refreshed private skill
        shell: bash
        working-directory: private-skills
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip skills-ref
          if ! command -v skills-ref >/dev/null 2>&1 \
            && command -v agentskills >/dev/null 2>&1; then
            printf '#!/usr/bin/env bash\nexec agentskills "$@"\n' \
              > "$RUNNER_TEMP/skills-ref"
            chmod +x "$RUNNER_TEMP/skills-ref"
            export PATH="$RUNNER_TEMP:$PATH"
          fi
          skills-ref validate skills/vgs-collect-react-native-guide
          git diff --cached --check

      - name: Prepare the refresh branch name
        id: sync-branch
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          branch_hash="$(printf '%s' "$RELEASE_TAG" | sha256sum | cut -c1-12)"
          echo "name=automation/sync-vgs-collect-react-native-guide-${branch_hash}" >> "$GITHUB_OUTPUT"

      - name: Create or update the pull request with signed commits
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.catalog-token.outputs.token }}
          path: private-skills
          base: main
          branch: ${{ steps.sync-branch.outputs.name }}
          add-paths: skills/vgs-collect-react-native-guide
          sign-commits: true
          commit-message: >-
            docs: sync vgs-collect-react-native-guide for ${{ github.ref_name }}
          title: >-
            docs: sync vgs-collect-react-native-guide for ${{ github.ref_name }}
          body: |
            Synchronizes `skills/vgs-collect-react-native-guide` from VGS Collect React Native ${{ github.ref_name }}.

            Source: https://github.com/${{ github.repository }}/tree/${{ github.sha }}

            Validation: `skills-ref validate skills/vgs-collect-react-native-guide` and `git diff --cached --check`.
